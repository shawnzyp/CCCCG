name: Syntax Check

on:
  push:
  pull_request:

jobs:
  node-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run injector tests
        run: node tools/tests/inject-dm-pin-hash.test.mjs
      - name: Check main.js syntax
        run: node --check scripts/main.js
      - name: Check dm.js syntax
        run: node --check scripts/dm.js
      - name: Check injector syntax
        run: node --check tools/inject-dm-pin-hash.mjs
